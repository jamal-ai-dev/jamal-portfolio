<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Jamal Nasir</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FAFAF8;
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    color: #1A1A1A;
  }
  .card {
    text-align: center;
    padding: 40px;
  }
  .monogram {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    background: #0F6E6E;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 26px;
    margin: 0 auto 22px auto;
  }
  h1 {
    font-weight: 700;
    font-size: 34px;
    margin-bottom: 10px;
  }
  p {
    font-size: 17px;
    color: #6B6B6B;
  }
  .dot {
    color: #F2A93B;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="monogram">MJ</div>
    <h1>Muhammad Jamal Nasir</h1>
    <p>Portfolio in progress <span class="dot">&bull;</span> AI &amp; automation systems builder</p>
  </div>
</body>
</html>
